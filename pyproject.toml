[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tselora"
version = "0.1.0"
description = "Open-source execution intelligence platform for AI agents."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [
  { name = "Tselora contributors" },
]
keywords = ["ai-agents", "observability", "execution-graph", "developer-tools"]
classifiers = [
  "Development Status :: 1 - Planning",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
# Runtime dependencies will be added when Week 1 implementation begins.
# Expected v1 stack: pydantic, fastapi, uvicorn, typer.
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
  "mypy>=1.11",
]

[project.urls]
Homepage = "https://github.com/tselora/tselora"
Documentation = "docs/architecture/overview.md"
Issues = "https://github.com/tselora/tselora/issues"

[tool.hatch.build.targets.wheel]
packages = ["core", "sdk", "server", "adapters", "cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["core", "sdk", "server", "adapters", "cli"]
